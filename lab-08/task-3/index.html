<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Завдання 3 — Галерея фотографій</title>
  <link rel="stylesheet" href="../css/reset.css">
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <h1 class="visually-hidden">Галерея фотографій</h1>
    <section class="gallery">
      <figure class="gallery__item">
        <img class="gallery__img" src="../images/photo1.jpg" alt="Пляж із папоротями" loading="lazy">
      </figure>
      <figure class="gallery__item">
        <img class="gallery__img" src="../images/photo2.jpg" alt="Стежка в лісі" loading="lazy">
      </figure>
      <figure class="gallery__item">
        <img class="gallery__img" src="../images/photo3.jpg" alt="Затока зі скелями" loading="lazy">
      </figure>
      <figure class="gallery__item">
        <img class="gallery__img" src="../images/photo4.jpg" alt="Тук-тук на ринку" loading="lazy">
      </figure>
      <figure class="gallery__item gallery__item--wide">
        <img class="gallery__img" src="../images/photo5.jpg" alt="Човен біля скель" loading="lazy">
      </figure>
      <figure class="gallery__item gallery__item--panorama">
        <img class="gallery__img" src="../images/photo6.jpg" alt="Захід сонця над морем" loading="lazy">
      </figure>
      <figure class="gallery__item">
        <img class="gallery__img" src="../images/photo7.jpg" alt="Вантажівка біля дороги" loading="lazy">
      </figure>
      <figure class="gallery__item">
        <img class="gallery__img" src="../images/photo8.jpg" alt="Будинок із квітами" loading="lazy">
      </figure>
      <figure class="gallery__item">
        <img class="gallery__img" src="../images/photo9.jpg" alt="Кава на терасі" loading="lazy">
      </figure>
      <figure class="gallery__item">
        <img class="gallery__img" src="../images/photo10.jpg" alt="Шезлонги на пляжі" loading="lazy">
      </figure>
      <figure class="gallery__item gallery__item--wide">
        <img class="gallery__img" src="../images/photo11.jpg" alt="Сад біля моря" loading="lazy">
      </figure>
    </section>
  </main>
</body>
</html>
