<!DOCTYPE html>

<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Завдання 1</title>
    <style type="text/css">
        table {
            border-collapse: collapse;
            width: 480px;
        }

        td {
            border: 2px solid #000;
        }

        tr {
            width: 60px;
            height: 60px;
        }
    </style>
</head>
<body>

    <div align="center">
        <p>
            <a href="../index.html">Повернутись на головну</a>
        </p>

        <h1>Завдання 1: таблиця</h1>

        <table>

            <tr>
                <td colspan="8" bgcolor="#800080"></td>
            </tr>

            <tr>
                <td rowspan="6" width="60" bgcolor="#DA70D6"></td>
                <td colspan="6" bgcolor="#800080"></td>
                <td rowspan="6" width="60" bgcolor="#DA70D6"></td>
            </tr>

            <tr>
                <td rowspan="4" width="60" bgcolor="#DA70D6"></td>
                <td colspan="4" bgcolor="#800080"></td>
                <td rowspan="4" width="60" bgcolor="#DA70D6"></td>
            </tr>

            <tr>
                <td rowspan="2" width="60" bgcolor="#DA70D6"></td>
                <td width="60" bgcolor="#FF1493"></td>
                <td width="60" bgcolor="#FFB6C1"></td>
                <td rowspan="2" width="60" bgcolor="#DA70D6"></td>
            </tr>

            <tr>
                <td bgcolor="#FF69B4"></td>
                <td bgcolor="#DB7093"></td>
            </tr>

            <tr>
                <td colspan="4" bgcolor="#800080"></td>
            </tr>

            <tr>
                <td colspan="6" bgcolor="#800080"></td>
            </tr>

            <tr>
                <td colspan="8" bgcolor="#800080"></td>
            </tr>
        </table>
    </div>

</body>
</html>
